# TechHub Nginx 反向代理配置
# 使用方法：将本文件复制到 Nginx 配置目录（如 /etc/nginx/conf.d/）并重命名为 techhub.conf

upstream flask_backend {
    server 127.0.0.1:5000;
    # 如需负载均衡，可添加多个后端：
    # server 127.0.0.1:5001;
    # server 127.0.0.1:5002;
}

server {
    listen 80;
    server_name localhost;

    # 日志配置
    access_log /var/log/nginx/techhub_access.log;
    error_log /var/log/nginx/techhub_error.log;

    # 开启 gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # API 请求代理到 Flask 后端
    location /api/ {
        proxy_pass http://flask_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # 支持长连接（如需 WebSocket，取消下方注释）
        # proxy_set_header Upgrade $http_upgrade;
        # proxy_set_header Connection "upgrade";
    }

    # 前端静态资源（生产环境构建后的 dist 目录）
    location / {
        root /path/to/techhub/frontend/dist;  # 请修改为实际路径
        index index.html;
        try_files $uri $uri/ /index.html;  # 支持 Vue Router History 模式
    }

    # 静态文件缓存策略
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        root /path/to/techhub/frontend/dist;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 健康检查端点（可选）
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}

